name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: why_i_suck_at_chess_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d why_i_suck_at_chess_ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      CI: true
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/why_i_suck_at_chess_ci

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npm run db:validate

      - name: Apply bootstrap migration
        run: npm run db:migrate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint and guardrails
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

browser-acceptance:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build shared packages
        run: npm run build:domain && npm run build:contracts

      - name: Install Chromium for browser acceptance
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Browser onboarding acceptance
        run: node apps/web/e2e/lichess-onboarding-smoke.mjs
