name: Real Stockfish pipeline acceptance

# Dedicated, bounded real-binary gate. Never run heavyweight engine searches
# as an implicit dependency of the normal npm test suite.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/api/test/pipeline-acceptance.test.mjs'
      - 'apps/api/test/native-worker-restart.test.mjs'
      - 'apps/api/src/modules/engine-analysis/**'
      - 'scripts/phase-7-stockfish-timing-benchmark.mjs'
      - 'scripts/phase-7-stockfish-timing-benchmark.test.mjs'
      - 'scripts/phase-7-benchmark-statistics.mjs'
      - 'scripts/phase-7-worker-cache-benchmark.mjs'
      - 'scripts/phase-7-worker-cache-policy.mjs'
      - 'scripts/phase-7-worker-cache-policy.test.mjs'
      - 'scripts/phase-7-stockfish-child-resources.mjs'
      - 'scripts/phase-7-stockfish-child-resources.test.mjs'
      - 'scripts/phase-7-node-host-resources.mjs'
      - 'scripts/phase-7-node-host-resources.test.mjs'
      - '.github/workflows/real-stockfish-acceptance.yml'

jobs:
  real-stockfish-pipeline:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: why_chess_real_engine_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d why_chess_real_engine_ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      CI: true
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/why_chess_real_engine_ci
      RUN_REAL_STOCKFISH_ACCEPTANCE: '1'
      STOCKFISH_PATH: /usr/games/stockfish
      STOCKFISH_DEBIAN_PACKAGE_VERSION: '16-1build1'
      STOCKFISH_COMMAND_TIMEOUT_MS: '15000'

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install and identify native Stockfish
        run: |
          sudo apt-get update
          # Fail closed if the identified Ubuntu 24.04 package version disappears.
          # Record the binary digest and runner CPU for repeatable Phase 7 baselines.
          sudo apt-get install -y --no-install-recommends "stockfish=$STOCKFISH_DEBIAN_PACKAGE_VERSION"
          test -x "$STOCKFISH_PATH"
          dpkg-query -W -f='Stockfish Debian package: ${Package} ${Version}\n' stockfish
          sha256sum "$STOCKFISH_PATH"
          lscpu | grep -E '^(Architecture|Model name|CPU\(s\)):'
          echo 'uci' | timeout 5 "$STOCKFISH_PATH" | grep -m 1 '^id name Stockfish '
      - name: Install dependencies and migrate disposable DB
        run: |
          npm ci
          npm run db:validate
          npm run db:migrate
      - name: Build API and shared dependencies
        run: npm run build:api
      - name: Run real Stockfish/DB integration (11 games incl. supersession and durable retries, depth 6, 1 thread)
        run: timeout 360s node --test apps/api/test/pipeline-acceptance.test.mjs
      - name: Run isolated native Node worker crash and lease recovery (depth 6, 1 thread)
        run: timeout 120s node --test apps/api/test/native-worker-restart.test.mjs
      - name: Run synthetic Phase 7 native timing microbaseline (not worker economics)
        env:
          RUN_PHASE7_ENGINE_BENCHMARK: '1'
        run: |
          timeout 120s node scripts/phase-7-stockfish-timing-benchmark.mjs > /tmp/phase7-native-timing.json
          node -e "const x=require('/tmp/phase7-native-timing.json'); if(x.schemaVersion!=='phase-7-native-timing-microbaseline-v2'||x.results.allSearches.count!==15||!x.environment.stockfishBinarySha256||!x.results.nativeChildResources?.peakResidentBytes||x.results.nativeChildResources.cpuTotalMs<0) process.exit(1)"
          cat /tmp/phase7-native-timing.json
      - name: Create isolated PostgreSQL database for persisted cache probe
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE why_chess_cache_benchmark_ci'
      - name: Run real persisted Stockfish cold/warm cache probe (synthetic, not pilot economics)
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/why_chess_cache_benchmark_ci
          RUN_PHASE7_CACHE_BENCHMARK: '1'
        run: |
          npm run db:migrate
          timeout 120s node scripts/phase-7-worker-cache-benchmark.mjs > /tmp/phase7-db-cache.json
          node -e "const x=require('/tmp/phase7-db-cache.json'); if(x.schemaVersion!=='phase-7-persisted-stockfish-cache-probe-v3'||x.results.cold.cacheMisses<=0||x.results.cold.cacheHits!==0||x.results.warm.cacheMisses!==0||x.results.warm.cacheHits!==x.results.cold.positionsTotal||!x.results.cold.nativeChildResources?.peakResidentBytes||!x.results.warm.nativeChildResources?.peakResidentBytes||x.results.cold.nativeChildResources.cpuTotalMs<0||x.results.warm.nativeChildResources.cpuTotalMs<0||!['cold','warm'].every(k=>x.results[k].nodeHostResources?.source==='NODE_PARENT_CPU_USAGE_AND_RSS_BOUNDARY_SNAPSHOTS'&&Number.isFinite(x.results[k].nodeHostResources.cpuTotalMs)&&x.results[k].nodeHostResources.cpuTotalMs>=0&&x.results[k].nodeHostResources.rssBeforeBytes>0&&x.results[k].nodeHostResources.rssAfterBytes>0)) process.exit(1)"
          cat /tmp/phase7-db-cache.json
